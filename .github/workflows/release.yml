# ビルドの成果物 (aarch64、arm64ec) と公式の x86 / x86_64 版の写しを Release に置く。
# 公式の物は dl.winehq.org から取得する (MPL 2.0 で再配布できる)。説明は release-notes.md を元にする。
name: release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "aarch64 版と arm64ec 版を作った build の実行の ID"
        required: true
      tag:
        description: "リリースのタグ"
        default: "gecko-2.47.4-2"

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      V: "2.47.4"
    steps:
      - uses: actions/checkout@v4

      - name: 取得
        run: |
          mkdir out
          for a in aarch64 arm64ec; do
            gh run download "${{ inputs.run_id }}" -n "wine-gecko-$a" -D out
          done
          for a in x86 x86_64; do
            curl -sfL --retry 5 -o "out/wine-gecko-$V-$a.tar.xz" "https://dl.winehq.org/wine/wine-gecko/$V/wine-gecko-$V-$a.tar.xz"
          done
          cd out
          for f in *.tar.xz; do xz -t "$f"; done
          # Android では xz を展開できないので zip も作る (先頭は wine-gecko-$V-<arch>/)
          for a in aarch64 arm64ec x86 x86_64; do
            d="wine-gecko-$V-$a"
            tar -xJf "$d.tar.xz"
            test -d "$d"
            zip -q -r -9 -X "$d.zip" "$d"
            rm -rf "./${d:?}"
          done
          ls -la && sha256sum *.tar.xz *.zip | tee ../sha256.txt

      - name: Release (下書き)
        run: |
          src=$(git rev-parse HEAD)
          sed -e "s#@COMMIT@#$src#g" -e "s#@RUN_URL@#https://github.com/${{ github.repository }}/actions/runs/${{ inputs.run_id }}#g" release-notes.md > notes.md
          {
            echo
            echo "## sha256"
            echo '```'
            cat sha256.txt
            echo '```'
          } >> notes.md
          gh release create "${{ inputs.tag }}" out/*.tar.xz out/*.zip --draft --title "Wine Gecko $V (${{ inputs.tag }})" --notes-file notes.md
