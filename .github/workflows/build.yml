# Wine Gecko 2.47.4 を aarch64-w64-mingw32 (ARM64 Windows) と arm64ec 向けに作る。
# ソースは WineHQ の GitLab から取得し、patches/ を当てる。秘密情報は使わない。
#
# aarch64: 公式と同じ LLVM 15 系の llvm-mingw、Debian bullseye (python3.9、autoconf2.13)
# arm64ec: arm64ec に対応した LLVM 23 系の llvm-mingw (Ubuntu 22.04 で作られているので bookworm で動かす)。
#          configure は aarch64 として通し (JIT なし、SSE なし、aarch64 版の xptcall)、コンパイラだけ arm64ec にする。
name: build

on:
  workflow_dispatch:
    inputs:
      keep_going:
        description: "make -k で失敗しても他を続ける (詰まり所を広く集める)"
        type: boolean
        default: false
      make_minutes:
        description: "make に使う最大の分数 (6 時間の制限より前に止めてログを残す)"
        default: "320"

env:
  GECKO_TAG: wine-gecko-2.47.4
  # mach の virtualenv に入る新しい setuptools の distutils 差し替えを止める
  SETUPTOOLS_USE_DISTUTILS: stdlib

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            image: debian:bullseye
            llvm_tag: "20220906"
            llvm: llvm-mingw-20220906-ucrt-ubuntu-18.04-x86_64
            llvm_sha256: ee00708bdd65eeaa88d5fa89ad7e3fa1d6bae8093ee4559748e431e55f7568ec
          - arch: arm64ec
            image: debian:bookworm
            llvm_tag: "20260908"
            llvm: llvm-mingw-20260908-ucrt-ubuntu-22.04-x86_64
            llvm_sha256: 2258c745e3155870c80793f3e8c80b28fbde11b9ff73c4c78783635b3440b092
    runs-on: ubuntu-latest
    timeout-minutes: 350
    container: ${{ matrix.image }}
    steps:
      - name: パッケージ
        run: |
          export DEBIAN_FRONTEND=noninteractive
          if grep -q bullseye /etc/os-release; then
            # bullseye はサポートが終わり archive.debian.org へ移った
            echo 'deb http://archive.debian.org/debian bullseye main' > /etc/apt/sources.list
            echo 'deb http://archive.debian.org/debian-security bullseye-security main' >> /etc/apt/sources.list
            rm -f /etc/apt/sources.list.d/*
            extra="python3 python3-distutils"
          else
            # Python 3.9 をソースから作るための物
            extra="libssl-dev zlib1g-dev libbz2-dev libffi-dev libsqlite3-dev"
          fi
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends gcc g++ git autoconf2.13 perl make \
            unzip zip xz-utils curl ca-certificates uuid-runtime $extra
          df -h / /__w || true; nproc

      - name: GNU make 4.4.1 (make 4.3 では config/external/nss で multiple target patterns になる)
        run: |
          curl -sfLO https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz
          echo "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3  make-4.4.1.tar.gz" | sha256sum -c
          tar xzf make-4.4.1.tar.gz
          cd make-4.4.1 && ./configure -q --prefix=/usr/local --without-guile && make -s -j"$(nproc)" && make -s install
          cd .. && rm -rf make-4.4.1*
          /usr/local/bin/make --version | head -1

      - name: Python 3.9 (bookworm の 3.11 では mach が動かない)
        if: matrix.arch == 'arm64ec'
        run: |
          git clone -q --depth 1 --branch v3.9.20 https://github.com/python/cpython.git cpython
          cd cpython && ./configure -q --prefix=/opt/py39 && make -s -j"$(nproc)" && make -s install
          cd .. && rm -rf cpython
          echo "/opt/py39/bin" >> "$GITHUB_PATH"
          /opt/py39/bin/python3 -c 'import sys, distutils; print(sys.version)'

      - uses: actions/checkout@v4
        with:
          path: ci

      - name: llvm-mingw
        run: |
          curl -sfLO "https://github.com/mstorsjo/llvm-mingw/releases/download/${{ matrix.llvm_tag }}/${{ matrix.llvm }}.tar.xz"
          echo "${{ matrix.llvm_sha256 }}  ${{ matrix.llvm }}.tar.xz" | sha256sum -c
          tar -C /opt -xJf "${{ matrix.llvm }}.tar.xz"
          rm "${{ matrix.llvm }}.tar.xz"
          echo "/opt/${{ matrix.llvm }}/bin" >> "$GITHUB_PATH"
          # aarch64 版の無い取り込みライブラリ (wintrust, rasdlg, rasapi32, esent) を作る
          if [ "${{ matrix.arch }}" = arm64ec ]; then
            sh ci/mkimplibs.sh "/opt/${{ matrix.llvm }}" "$PWD/implibs" arm64ec
            sh ci/ec-wrapper.sh "/opt/${{ matrix.llvm }}/bin" clang /opt/ec-clang
            sh ci/ec-wrapper.sh "/opt/${{ matrix.llvm }}/bin" clang++ /opt/ec-clang++
          else
            sh ci/mkimplibs.sh "/opt/${{ matrix.llvm }}" implibs arm64
            cp implibs/*.a "/opt/${{ matrix.llvm }}/aarch64-w64-mingw32/lib/"
          fi

      - name: ソース
        run: |
          git init -q src
          cd src
          git remote add origin https://gitlab.winehq.org/wine/wine-gecko.git
          git fetch -q --depth 1 origin "refs/tags/$GECKO_TAG:refs/tags/$GECKO_TAG"
          git checkout -q "$GECKO_TAG"
          git log -1 --format='%H %s'
          for p in ../ci/patches/*.patch; do echo "== $p"; git apply --whitespace=nowarn "$p"; done
          git diff --stat | tail -1

      - name: configure
        shell: bash
        run: |
          set -o pipefail
          sed -e "s#@OBJDIR@#$PWD/obj#" -e "s#@JOBS@#$(nproc)#" ci/mozconfig.in > mozconfig
          if [ "${{ matrix.arch }}" = arm64ec ]; then
            {
              echo
              echo '# ARM64EC: configure は aarch64 として通し、コンパイラだけ arm64ec にする'
              echo 'CC=/opt/ec-clang'
              echo 'CXX=/opt/ec-clang++'
              echo 'export CFLAGS="$CFLAGS -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=implicit-function-declaration"'
              echo "export LDFLAGS=\"\$LDFLAGS -L$PWD/implibs\""
            } >> mozconfig
          fi
          export MOZCONFIG="$PWD/mozconfig" SHELL=/bin/sh
          cd src
          ./mach configure 2>&1 | tee ../configure.log

      - name: make
        run: |
          export MOZCONFIG="$PWD/mozconfig" SHELL=/bin/sh
          k=""; [ "${{ inputs.keep_going }}" = "true" ] && k="-k"
          set +e
          timeout "$(( ${{ inputs.make_minutes }} * 60 ))" make $k -j"$(nproc)" -C obj > build.log 2>&1
          rc=$?
          echo "make rc=$rc" | tee -a build.log
          exit $rc

      - name: 失敗の要約
        if: always()
        run: |
          sh ci/summarize.sh build.log > errors-summary.txt || true
          head -80 errors-summary.txt || true
          tail -c 100000 build.log > build-tail.log || true
          xz -T0 -k build.log || true

      - name: 配布物 (make_package と同じ手順の前半)
        if: success()
        run: |
          export MOZCONFIG="$PWD/mozconfig" SHELL=/bin/sh
          make -C obj/browser/installer
          v=$(head -n 1 src/wine/VERSION); d=wine-gecko-$v-${{ matrix.arch }}
          rm -rf "obj/dist/${d:?}"; cp -r obj/dist/firefox "obj/dist/$d"
          printf 'Wine Gecko %s' "$v" > "obj/dist/$d/VERSION"
          while read -r f; do rm -f "obj/dist/${d:?}/${f:?}"; done < src/wine/remove-files.txt
          tar -C obj/dist -cJf "$d.tar.xz" "$d"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.arch }}
          path: |
            configure.log
            build.log.xz
            build-tail.log
            errors-summary.txt
            obj/config.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wine-gecko-${{ matrix.arch }}
          path: wine-gecko-*-${{ matrix.arch }}.tar.xz
